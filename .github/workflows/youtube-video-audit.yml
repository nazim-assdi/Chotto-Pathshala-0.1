name: YouTube public video metadata audit (no API key)

on:
  push:
    branches:
      - feature/advanced-learning
    paths:
      - "tool/audit_youtube_videos.py"
      - "tool/test_audit_youtube_videos.py"
      - "assets/videos/video_catalog.json"
      - "docs/VIDEO_API_AUDIT.md"
      - ".github/workflows/youtube-video-audit.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of first catalogue videos to check (0 = all)"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: feature/advanced-learning
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test keyless audit
        run: python -m unittest discover -s tool -p "test_audit_youtube_videos.py" -v
      - name: Validate input
        env:
          AUDIT_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          case "$AUDIT_LIMIT" in
            ''|*[!0-9]*)
              echo "::error::Limit must be a non-negative integer."
              exit 1
              ;;
          esac
      - name: Run public YouTube metadata preflight
        env:
          AUDIT_LIMIT: ${{ inputs.limit || '0' }}
        run: python tool/audit_youtube_videos.py --limit "$AUDIT_LIMIT"
      - name: Summarize results
        if: always()
        run: |
          if [ -f build/youtube_video_public_audit.csv ]; then
            python - <<'PY'
          import csv
          import os
          from collections import Counter
          with open("build/youtube_video_public_audit.csv", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          results = Counter(r.get("oembed_result", "") for r in rows)
          titles = Counter(r.get("title_match", "") for r in rows)
          channels = Counter(r.get("channel_match", "") for r in rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("# YouTube public metadata preflight\n\n")
              s.write(f"- Records checked: **{len(rows)}**\n")
              s.write(f"- Public metadata found: **{results.get('FOUND', 0)}**\n")
              s.write(f"- Other HTTP/network responses: **{len(rows) - results.get('FOUND', 0)}**\n")
              s.write(f"- Catalogue title differs: **{titles.get('DIFFERS', 0)}**\n")
              s.write(f"- Catalogue channel differs: **{channels.get('DIFFERS', 0)}**\n\n")
              s.write("**No API key was used. This preflight does not confirm Made for Kids, embedding permission, full-video suitability, usage rights, or approve videos.**\n")
          PY
          fi
      - name: Upload public metadata audit CSV
        if: always() && hashFiles('build/youtube_video_public_audit.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-public-video-audit
          path: build/youtube_video_public_audit.csv
          if-no-files-found: error
          retention-days: 14
