name: One-time Dart Formatter
# Re-run after the unbraced-if lint repair

on:
  push:
    branches:
      - feature/advanced-learning
    paths:
      - ".github/workflows/format-dart-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format changed localization Dart files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run Dart formatter
        run: |
          dart format \
            lib/main.dart \
            lib/video_library.dart \
            lib/word_gallery_localization.dart \
            test/ui_localization_test.dart \
            test/widget_test.dart

      - name: Commit formatter output
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet --             lib/main.dart             lib/video_library.dart             lib/word_gallery_localization.dart             test/ui_localization_test.dart             test/widget_test.dart; then
            echo "All selected Dart files were already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/main.dart             lib/video_library.dart             lib/word_gallery_localization.dart             test/ui_localization_test.dart             test/widget_test.dart
          git commit -m "Format three-language localization Dart source"
          git push origin "HEAD:${BRANCH_NAME}"
