name: Publish Chotto Pathshala Privacy Policy

on:
  push:
    branches:
      - feature/advanced-learning
    paths:
      - "docs/privacy-policy.html"
      - "docs/terms-of-use.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-policy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare public privacy-policy site
        run: |
          mkdir -p public-privacy-site
          cp docs/privacy-policy.html public-privacy-site/privacy-policy.html
          cp docs/terms-of-use.html public-privacy-site/terms-of-use.html

      - name: Upload privacy-policy website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-privacy-site

      - name: Deploy privacy-policy website
        id: deployment
        uses: actions/deploy-pages@v4
