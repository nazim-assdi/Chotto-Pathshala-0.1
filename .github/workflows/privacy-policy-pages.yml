name: Publish Chotto Pathshala Privacy Policy

on:
  push:
    branches:
      - feature/advanced-learning
    paths:
      - "docs/privacy-policy.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-policy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload privacy-policy website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy privacy-policy website
        id: deployment
        uses: actions/deploy-pages@v4
