name: Chotto Pathshala Multi-Platform Release

on:
  push:
    branches: [feature/advanced-learning]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'assets/**'
      - 'app/src/main/assets/content/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/multiplatform-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chotto-pathshala-multiplatform-release
  cancel-in-progress: false

env:
  APP_VERSION: 1.0.0

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Install Android NDK
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then exit 0; fi
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then exit 0; fi
            sleep 10
          done
          echo "Android NDK installation failed"
          exit 1
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk chotto-pathshala-${{ env.APP_VERSION }}-android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-android-apk
          path: chotto-pathshala-${{ env.APP_VERSION }}-android-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,windows .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath chotto-pathshala-${{ env.APP_VERSION }}-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-windows-x64
          path: chotto-pathshala-${{ env.APP_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,macos .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build macos --release
      - name: Package macOS app
        shell: bash
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "chotto-pathshala-${APP_VERSION}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-macos
          path: chotto-pathshala-${{ env.APP_VERSION }}-macos.zip
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned device app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "chotto-pathshala-${APP_VERSION}-ios-unsigned-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-ios-unsigned-app
          path: chotto-pathshala-${{ env.APP_VERSION }}-ios-unsigned-app.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,linux .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release
      - name: Package Linux app
        run: tar -czf chotto-pathshala-${APP_VERSION}-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-linux-x64
          path: chotto-pathshala-${{ env.APP_VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release-pack:
    name: Assemble release pack
    runs-on: ubuntu-latest
    needs: [android, windows, macos, ios, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-android-apk
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-macos
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-ios-unsigned-app
          path: release/ios
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-linux-x64
          path: release/linux
      - name: Add release notes
        run: |
          cat > release/BUILD-INFO.txt <<'EOF'
          Chotto Pathshala - Multi-platform Release Pack
          Version: ${{ env.APP_VERSION }}

          Android: release APK
          Windows: x64 release application bundle (ZIP)
          macOS: release .app bundle (ZIP)
          iOS: unsigned iPhoneOS .app bundle (ZIP); Apple signing is required before installation or App Store submission
          Linux: x64 release application bundle (tar.gz)

          Notes:
          - Windows and Linux bundles must be extracted before launching.
          - The iOS package is not a signed IPA. A valid Apple Developer signing certificate and provisioning profile are required for an installable IPA.
          EOF
      - name: Create combined release pack
        run: |
          cd release
          zip -r "../Chotto-Pathshala-${{ env.APP_VERSION }}-Multi-Platform-Release-Pack.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-multi-platform-release-pack
          path: Chotto-Pathshala-${{ env.APP_VERSION }}-Multi-Platform-Release-Pack.zip
          if-no-files-found: error
          retention-days: 90
