name: ছোট্ট পাঠশালা - Multi-platform Release

on:
  push:
    branches: [feature/advanced-learning]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'assets/**'
      - 'installer/**'
      - 'app/src/main/assets/content/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/multiplatform-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chotto-pathshala-multiplatform-release
  cancel-in-progress: true

env:
  APP_VERSION: 1.2.2

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,macos .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: python tool/set_app_branding.py
      - run: flutter analyze
      - run: flutter test
      - name: Install Android NDK
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then exit 0; fi
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then exit 0; fi
            sleep 10
          done
          echo "Android NDK installation failed"
          exit 1
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-android-apk
          path: ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-android-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer and portable bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,macos .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: python tool/set_app_branding.py
      - run: flutter build windows --release
      - name: Build Bengali Windows installer and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "build/windows/x64/runner/Release"
          $exeItem = Get-ChildItem -Path $releaseDir -File -Filter "*.exe" | Select-Object -First 1
          if (-not $exeItem) { throw "Flutter release executable was not found." }
          if ($exeItem.Name -ne "ছোট্ট পাঠশালা.exe") {
            Rename-Item -LiteralPath $exeItem.FullName -NewName "ছোট্ট পাঠশালা.exe"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "ছোট্ট পাঠশালা Portable.zip" -Force
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          & $compiler /Qp "installer/ছোট্ট-পাঠশালা.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "build/windows/installer/ছোট্ট-পাঠশালা-ইনস্টলার.exe"
          if (-not (Test-Path $setup)) { throw "Windows installer output was not created." }
          Copy-Item -LiteralPath $setup -Destination "ছোট্ট-পাঠশালা-ইনস্টলার.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-windows-x64
          path: ছোট্ট পাঠশালা Portable.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-windows-installer
          path: ছোট্ট-পাঠশালা-ইনস্টলার.exe
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,macos .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: python tool/set_app_branding.py
      - run: flutter build macos --release
      - name: Package macOS app
        shell: bash
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          BENGALI_APP_PATH="$(dirname "$APP_PATH")/ছোট্ট পাঠশালা.app"
          mv "$APP_PATH" "$BENGALI_APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$BENGALI_APP_PATH" "ছোট্ট-পাঠশালা-${APP_VERSION}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-macos
          path: ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-macos.zip
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned device app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,macos .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: python tool/set_app_branding.py
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          mv build/ios/iphoneos/Runner.app "build/ios/iphoneos/ছোট্ট পাঠশালা.app"
          ditto -c -k --sequesterRsrc --keepParent "build/ios/iphoneos/ছোট্ট পাঠশালা.app" "ছোট্ট-পাঠশালা-${APP_VERSION}-ios-unsigned-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-ios-unsigned-app
          path: ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-ios-unsigned-app.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev libsoup-3.0-0 libsoup-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,macos,linux .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: python tool/set_app_branding.py
      - run: flutter build linux --release
      - name: Package Linux app
        shell: bash
        run: |
          APP_BINARY="$(find build/linux/x64/release/bundle -maxdepth 1 -type f -executable -print -quit)"
          test -n "$APP_BINARY"
          mv "$APP_BINARY" "build/linux/x64/release/bundle/ছোট্ট পাঠশালা"
          tar -czf "ছোট্ট-পাঠশালা-${APP_VERSION}-linux-x64.tar.gz" -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-linux-x64
          path: ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release-pack:
    name: Assemble release pack
    runs-on: ubuntu-latest
    needs: [android, windows, macos, ios, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-android-apk
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-windows-installer
          path: release/windows-installer
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-macos
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-ios-unsigned-app
          path: release/ios
      - uses: actions/download-artifact@v4
        with:
          name: chotto-pathshala-linux-x64
          path: release/linux
      - name: Add release notes
        run: |
          cat > release/BUILD-INFO.txt <<'EOF'
          ছোট্ট পাঠশালা - Multi-platform Release Pack
          Version: ${{ env.APP_VERSION }}

          Android: release APK
          Windows: Installable Bengali-named Setup.exe and portable ZIP
          macOS: release .app bundle (ZIP)
          iOS: unsigned iPhoneOS .app bundle (ZIP); Apple signing is required before installation or App Store submission
          Linux: x64 release application bundle (tar.gz)

          Notes:
          - Windows and Linux bundles must be extracted before launching.
          - Windows desktop video playback uses the Microsoft Edge WebView2 Runtime. Windows 11 includes it; some Windows 10 PCs may need the Evergreen Runtime installed.
          - Linux desktop video playback uses WebKitGTK 4.1 and libsoup 3 runtime libraries.
          - The iOS package is not a signed IPA. A valid Apple Developer signing certificate and provisioning profile are required for an installable IPA.
          EOF
      - name: Create combined release pack
        run: |
          cd release
          zip -r "../ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-সম্পূর্ণ-রিলিজ-প্যাক.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ছোট্ট-পাঠশালা-সম্পূর্ণ-রিলিজ-প্যাক
          path: ছোট্ট-পাঠশালা-${{ env.APP_VERSION }}-সম্পূর্ণ-রিলিজ-প্যাক.zip
          if-no-files-found: error
          retention-days: 90
