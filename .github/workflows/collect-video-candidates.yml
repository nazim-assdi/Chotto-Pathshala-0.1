name: Collect 1,000 real video candidates

on:
  push:
    branches: [feature/advanced-learning]
    paths:
      - 'tool/collect_video_candidates.py'
      - '.github/workflows/collect-video-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-video-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-learning
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata extractor
        run: python -m pip install --upgrade yt-dlp
      - name: Collect public video metadata (no media downloads)
        run: python tool/collect_video_candidates.py
      - name: Commit catalogue and review register
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/video_catalog.json docs/VIDEO_CONTENT_REVIEW.csv
          if git diff --cached --quiet; then
            echo "No new video candidates were discovered."
            exit 0
          fi
          git commit -m "Collect real video candidates for child-safety review"
          git push
