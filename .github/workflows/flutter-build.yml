name: Flutter builds

on:
  push:
    branches: [feature/advanced-learning]
    paths:
      - 'tool/**'
      - 'installer/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'app/src/main/assets/content/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [feature/advanced-learning]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'app/src/main/assets/content/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,macos .
      # flutter create regenerates the default test; restore our tracked project test.
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: python tool/set_app_branding.py
      - run: flutter analyze
      - run: flutter test
      # Preinstall the NDK with retries; Gradle's first automatic download can be interrupted.
      - name: Install Android NDK (retry on download failure)
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              echo "Android NDK $NDK_VERSION is already installed."
              exit 0
            fi
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              echo "Android NDK $NDK_VERSION installed and verified."
              exit 0
            fi
            echo "NDK download attempt $attempt failed verification."
            sleep 10
          done
          echo "Could not install Android NDK after 3 attempts."
          exit 1
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Launcher icon generation also needs the Android manifest in this job.
      - run: flutter create --platforms=android,ios,windows,macos .
      # flutter create regenerates the default test; restore our tracked project test.
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Build Bengali Windows installer and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "build/windows/x64/runner/Release"
          $exeItem = Get-ChildItem -Path $releaseDir -File -Filter "*.exe" | Select-Object -First 1
          if (-not $exeItem) { throw "Flutter release executable was not found." }
          if ($exeItem.Name -ne "ছোট্ট পাঠশালা.exe") {
            Rename-Item -LiteralPath $exeItem.FullName -NewName "ছোট্ট পাঠশালা.exe"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "ছোট্ট পাঠশালা Portable.zip" -Force
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          & $compiler /Qp "installer/ছোট্ট-পাঠশালা.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "build/windows/installer/ছোট্ট-পাঠশালা-ইনস্টলার.exe"
          if (-not (Test-Path $setup)) { throw "Windows installer output was not created." }
          Copy-Item -LiteralPath $setup -Destination "ছোট্ট-পাঠশালা-ইনস্টলার.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-windows-installer
          path: ছোট্ট-পাঠশালা-ইনস্টলার.exe
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-windows
          path: ছোট্ট পাঠশালা Portable.zip
          if-no-files-found: error
          retention-days: 30
