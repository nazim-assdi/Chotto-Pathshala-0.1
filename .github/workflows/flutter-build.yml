name: Flutter builds

on:
  push:
    branches: [feature/advanced-learning]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/icon/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'content/curriculum/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [feature/advanced-learning]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/icon/**'
      - 'pubspec.yaml'
      - 'content/curriculum/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,windows .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: python tool/prepare_android.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Install Android NDK (retry on download failure)
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              echo "Android NDK $NDK_VERSION is already installed."
              exit 0
            fi
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              echo "Android NDK $NDK_VERSION installed and verified."
              exit 0
            fi
            echo "NDK download attempt $attempt failed verification."
            sleep 10
          done
          echo "Could not install Android NDK after 3 attempts."
          exit 1
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,windows .
      - run: git checkout -- test/widget_test.dart
      - run: python -m pip install pillow
      - run: python tool/generate_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: chotto-pathshala-windows
          path: build/windows/x64/runner/Release/
