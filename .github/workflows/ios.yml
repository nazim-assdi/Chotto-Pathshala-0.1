name: iOS simulator build

on:
  push:
    branches: [ main, feature/advanced-learning ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build iPhone and iPad simulator app
        run: xcodebuild -project ios/SHIKHONIX.xcodeproj -scheme SHIKHONIX -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: shikhonix-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/SHIKHONIX.app
          if-no-files-found: error
