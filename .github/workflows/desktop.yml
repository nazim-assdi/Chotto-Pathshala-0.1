name: Desktop packages

on:
  push:
    branches: [ main, feature/advanced-learning ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: chotto-pathshala-windows
            path: desktop/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact: chotto-pathshala-macos
            path: desktop/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            artifact: chotto-pathshala-linux
            path: desktop/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build native desktop package
        run: gradle :desktop:packageDistributionForCurrentOS
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
