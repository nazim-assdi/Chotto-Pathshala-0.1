name: chotto_pathshala
description: "শিশুদের জন্য বাংলা, ইংরেজি ও আরবি শেখার অফলাইন শিক্ষামূলক অ্যাপ।"
publish_to: "none"
version: 1.3.0+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.3
  flutter_svg: ^2.0.10
  http: ^1.2.2
  xml: ^6.5.0
  youtube_player_iframe: ^6.0.2
  desktop_webview_window: ^0.4.2
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

